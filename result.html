<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Assessment Submitted — Dhruva Club</title>
  <meta name="description" content="Thank you for taking the Dhruva Club PQ IQ SQ Assessment. Join your official student community group.">
  <meta name="theme-color" content="#0A1628">
  <!-- Prevent any page caching so auth token cannot be replayed via back button -->
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* ── Result-page specific styles ── */
    .result-score-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin: 28px 0;
    }

    .score-card {
      background: var(--surface-2, #f8f9fc);
      border: 1px solid var(--border, #e2e8f0);
      border-radius: 16px;
      padding: 22px 22px 18px;
      transition: box-shadow 0.2s;
      text-align: left;
    }
    .score-card:hover { box-shadow: 0 6px 24px rgba(10,22,40,0.10); }

    .score-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      text-align: left;
    }
    .score-card-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .score-dimension-icon { font-size: 1.6rem; }
    .score-dimension-name {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary, #0A1628);
      margin: 0 0 2px;
    }
    .score-dimension-tag {
      font-size: 0.72rem;
      color: var(--text-secondary, #64748b);
      font-weight: 500;
    }
    .score-badge-value {
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--primary, #1A50BF);
      letter-spacing: -1px;
    }

    .score-progress-track {
      height: 7px;
      background: var(--border, #e2e8f0);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .score-progress-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .score-card-pq .score-progress-fill { background: linear-gradient(90deg, #1A50BF, #3b82f6); }
    .score-card-iq .score-progress-fill { background: linear-gradient(90deg, #0A1628, #1A50BF); }
    .score-card-sq .score-progress-fill { background: linear-gradient(90deg, #B8960A, #f59e0b); }

    .score-tier-pill {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: var(--primary-faint, rgba(26,80,191,0.08));
      color: var(--primary, #1A50BF);
      border-radius: 99px;
      padding: 3px 12px;
      margin-bottom: 14px;
    }
    .score-card-sq .score-tier-pill {
      background: rgba(184,150,10,0.1);
      color: #8a6f00;
    }
    .score-card-iq .score-tier-pill {
      background: rgba(10,22,40,0.07);
      color: #0A1628;
    }

    /* Intro text */
    .score-intro-text {
      font-size: 0.88rem;
      color: var(--text-secondary, #64748b);
      line-height: 1.6;
      margin-bottom: 14px;
      font-style: italic;
      text-align: left;
    }

    /* Bullet list */
    .score-bullets {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
    }
    .score-bullets li {
      position: relative;
      padding-left: 18px;
      font-size: 0.875rem;
      color: var(--text-primary, #0A1628);
      line-height: 1.55;
      text-align: left;
      word-break: break-word;
    }
    .score-bullets li::before {
      content: "•";
      position: absolute;
      left: 0;
      top: -0.05em;
      color: var(--primary, #1A50BF);
      font-weight: 900;
      font-size: 1.2rem;
      line-height: 1.55;
    }
    .score-card-pq .score-bullets li::before { color: #1A50BF; }
    .score-card-iq .score-bullets li::before { color: #0A1628; }
    .score-card-sq .score-bullets li::before { color: #B8960A; }


    /* ── Combined CTA Box ── */
    .cta-box {
      border-radius: 18px;
      padding: 28px 24px;
      margin: 28px 0 0;
      text-align: center;
      background: linear-gradient(135deg, #0A1628 0%, #1A50BF 100%);
      color: #fff;
    }
    .cta-box-badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      background: rgba(255,255,255,0.15);
      border-radius: 99px;
      padding: 3px 12px;
      margin-bottom: 12px;
      color: #fff;
    }
    .cta-box h3 {
      font-size: 1.25rem;
      font-weight: 800;
      margin: 0 0 10px;
      color: #fff;
    }
    .cta-box p {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.82);
      margin: 0 0 20px;
      line-height: 1.6;
    }
    .whatsapp-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #25D366;
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 13px 26px;
      border-radius: 99px;
      text-decoration: none;
      transition: transform 0.18s, box-shadow 0.18s;
      box-shadow: 0 4px 16px rgba(37,211,102,0.35);
    }
    .whatsapp-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(37,211,102,0.45);
    }
    .whatsapp-icon { width: 22px; height: 22px; fill: #fff; flex-shrink: 0; }

    /* Score summary row */
    .overall-score-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin: 0 0 24px;
      flex-wrap: wrap;
    }
    .overall-score-chip {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--surface-2, #f8f9fc);
      border: 1px solid var(--border, #e2e8f0);
      border-radius: 12px;
      padding: 10px 16px;
      min-width: 80px;
    }
    .overall-score-chip .chip-val {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--primary, #1A50BF);
    }
    .overall-score-chip .chip-label {
      font-size: 0.68rem;
      color: var(--text-secondary, #64748b);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }

    .result-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-primary, #0A1628);
      text-align: center;
      margin: 0 0 6px;
    }
    .result-greeting {
      text-align: center;
      color: var(--text-secondary, #64748b);
      font-size: 0.9rem;
      margin: 0 0 22px;
      line-height: 1.6;
    }
    .club-gallery {
      margin: 0 0 28px;
    }
    .club-gallery-title {
      margin: 0 0 14px;
      color: var(--text-primary, #0A1628);
      font-size: 1.1rem;
      text-align: center;
    }
    .club-gallery-slideshow {
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      background: #0A1628;
    }
    .club-gallery-slide {
      margin: 0;
    }
    .club-gallery-slide[hidden] {
      display: none;
    }
    .club-gallery-slide img {
      display: block;
      width: 100%;
      height: clamp(240px, 48vw, 420px);
      object-fit: cover;
    }
    .club-gallery-caption {
      padding: 10px 14px;
      color: #fff;
      font-size: 0.85rem;
      text-align: center;
      background: linear-gradient(transparent, rgba(10,22,40,0.96));
    }
    .club-gallery-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 12px;
    }
    .club-gallery-arrow,
    .club-gallery-dot {
      border: 0;
      cursor: pointer;
    }
    .club-gallery-arrow {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      color: #fff;
      background: var(--primary, #1A50BF);
      font-size: 1.25rem;
    }
    .club-gallery-arrow:focus-visible,
    .club-gallery-dot:focus-visible {
      outline: 3px solid #f59e0b;
      outline-offset: 3px;
    }
    .club-gallery-position {
      min-width: 44px;
      color: var(--text-secondary, #64748b);
      font-size: 0.85rem;
      text-align: center;
    }
    .club-gallery-dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 10px;
    }
    .club-gallery-dot {
      width: 9px;
      height: 9px;
      padding: 0;
      border-radius: 50%;
      background: #cbd5e1;
    }
    .club-gallery-dot[aria-current="true"] {
      background: var(--primary, #1A50BF);
      transform: scale(1.25);
    }
    .celebration-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 60px; height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1A50BF, #3b82f6);
      color: #fff;
      margin: 0 auto 16px;
      box-shadow: 0 6px 20px rgba(26,80,191,0.3);
    }

    .invalid-session-notice {
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 12px;
      padding: 20px;
      color: #dc2626;
      font-size: 0.9rem;
      line-height: 1.6;
      text-align: center;
      margin-bottom: 16px;
    }

    @media (max-width: 480px) {
      .score-card { padding: 18px 16px 14px; }
      .score-badge-value { font-size: 1.4rem; }
      .cta-box { padding: 22px 16px; }
      .cta-box h3 { font-size: 1.1rem; }
      .club-gallery-slide img { height: 240px; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Brand Header -->
    <header class="brand-header">
      <div class="header-top">
        <div class="brand-logo-wrap">
          <img src="assets/logo.png" alt="Dhruva Club Logo" class="brand-logo" onerror="this.style.display='none'">
        </div>
      </div>
      <div class="brand-badge" id="resultBadge">Assessment Complete</div>
      <h1 class="brand-title">Dhruva Club</h1>
      <p class="brand-tagline">Navigating Success with Wisdom</p>
    </header>

    <!-- Result Card -->
    <main class="result-card form-card" id="resultCard" style="max-width:680px;margin:0 auto 32px;">
      <!-- Content injected by script below -->
    </main>

    <footer class="footer-text">
      <p>&copy; 2026 Dhruva Club. All rights reserved. Cultivating Character, Competence &amp; Compassion.</p>
    </footer>

  </div>

  <script src="js/security.js"></script>
  <script src="js/content.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const config = window.DHRUVA_CONFIG || {};
      const resultConf = config.resultPage || {};
      const resultCard = document.getElementById("resultCard");
      const resultBadge = document.getElementById("resultBadge");

      // ──────────────────────────────────────────────────────────────
      // SECURITY GATE: Read ONLY from sessionStorage — never from URL.
      // ──────────────────────────────────────────────────────────────
      const authToken = sessionStorage.getItem("dhruva_auth_token");
      sessionStorage.removeItem("dhruva_auth_token"); // immediate clear

      let sessionData = null;
      if (window.DhruvaSecurity && authToken) {
        sessionData = window.DhruvaSecurity.decryptSessionPayload(authToken);
      }

      let verifiedGender = sessionData?.gender || null;
      if (!verifiedGender && window.DhruvaSecurity && authToken) {
        verifiedGender = window.DhruvaSecurity.decryptGenderToken(authToken);
      }

      // If no valid session token, show rejection
      if (!verifiedGender) {
        if (resultBadge) resultBadge.textContent = "Access Denied";
        resultCard.innerHTML = `
          <div class="invalid-session-notice">
            <strong>⚠️ Invalid or Expired Session</strong><br><br>
            This evaluation dashboard is accessible only immediately upon submitting the assessment.<br>
            Please go back and complete the assessment to view your personalized score analysis.
          </div>
          <a href="index.html" class="btn btn-primary" style="display:inline-flex;margin-top:16px;">
            ← Go Back to Assessment
          </a>
        `;
        return;
      }

      const studentName = sessionData?.fullName && sessionData.fullName !== "Student"
        ? sessionData.fullName
        : "";

      const scores = sessionData?.scores || { pq: 75, iq: 75, sq: 75 };
      const totalScore = sessionData?.totalScore || Math.round((scores.pq + scores.iq + scores.sq) / 3);

      // ── Helper: find tier for a dimension and score ──
      function getTier(dimensionKey, score) {
        const dimConf = config.scoreInsights?.[dimensionKey];
        if (!dimConf) return null;
        return dimConf.tiers.find(t => score >= t.min && score <= t.max)
          || dimConf.tiers[dimConf.tiers.length - 1];
      }

      function getDimConf(dimensionKey) {
        return config.scoreInsights?.[dimensionKey] || {};
      }

      // ── Helper: render bullet list ──
      function buildBullets(bullets) {
        if (!bullets || !bullets.length) return "";
        return bullets.map(b => `<li>${b}</li>`).join("");
      }

      // ── Build a score card for one dimension ──
      function buildScoreCard(dimKey, score) {
        const dimConf = getDimConf(dimKey);
        const tier = getTier(dimKey, score);
        if (!tier) return "";

        const cardClass = `score-card score-card-${dimKey}`;
        const bulletsHtml = buildBullets(tier.bullets || []);
        const introHtml = tier.intro
          ? `<p class="score-intro-text">${tier.intro}</p>`
          : "";

        return `
          <div class="${cardClass}">
            <div class="score-card-header">
              <div class="score-card-title-group">
                <span class="score-dimension-icon">${dimConf.icon || ""}</span>
                <div>
                  <h4 class="score-dimension-name">${dimConf.name || dimKey.toUpperCase()}</h4>
                  <span class="score-dimension-tag">${dimConf.tag || ""}</span>
                </div>
              </div>
              <div class="score-badge-value">${score}%</div>
            </div>
            <div class="score-progress-track">
              <div class="score-progress-fill" style="width: ${score}%"></div>
            </div>
            <div class="score-tier-pill">${tier.label}</div>
            ${introHtml}
            <ul class="score-bullets">${bulletsHtml}</ul>
          </div>
        `;
      }

      // ── Find CTA tier based on overall average score ──
      function getCTATier(overall) {
        const tiers = resultConf.ctaTiers || [];
        return tiers.find(t => overall >= t.min && overall <= t.max)
          || tiers[tiers.length - 1]
          || { heading: "Join Your Community", body: "Connect with Dhruva Club to keep growing.", buttonText: "Join Now" };
      }

      // ── Determine WhatsApp link by verified gender ──
      let targetLink = config.whatsappLinks?.default || "#";
      if (verifiedGender === "female") {
        targetLink = config.whatsappLinks?.female || config.whatsappLinks?.default || "#";
      } else if (verifiedGender === "male") {
        targetLink = config.whatsappLinks?.male || config.whatsappLinks?.default || "#";
      }

      const ctaTier = getCTATier(totalScore);

      const hasJoined = sessionData?.whatsappStatus === "joined";
      const ctaHeading = hasJoined ? "Welcome to the Dhruva Club Community!" : ctaTier.heading;
      const ctaBody = hasJoined
        ? `${studentName ? studentName + ", you" : "You"} have confirmed joining the official WhatsApp community group. Stay connected for upcoming workshop invitations, mentor interactions, and your personal quotient development roadmap.`
        : ctaTier.body;
      const ctaBtnText = hasJoined ? "Open WhatsApp Community Group" : ctaTier.buttonText;

      // ── Personalized greeting ──
      const personalizedGreeting = studentName
        ? `Congratulations, <strong>${studentName}</strong>! Here is your personalized PQ · IQ · SQ score analysis.`
        : "Here is your personalized PQ · IQ · SQ score analysis.";

      // ── Overall score chips ──
      const overallChips = `
        <div class="overall-score-bar">
          <div class="overall-score-chip">
            <span class="chip-val">${scores.pq}%</span>
            <span class="chip-label">PQ</span>
          </div>
          <div class="overall-score-chip">
            <span class="chip-val">${scores.iq}%</span>
            <span class="chip-label">IQ</span>
          </div>
          <div class="overall-score-chip">
            <span class="chip-val">${scores.sq}%</span>
            <span class="chip-label">SQ</span>
          </div>
          <div class="overall-score-chip" style="background:linear-gradient(135deg,#1A50BF,#3b82f6);border-color:transparent;">
            <span class="chip-val" style="color:#fff;">${totalScore}%</span>
            <span class="chip-label" style="color:rgba(255,255,255,0.8);">Overall</span>
          </div>
        </div>
      `;

      // ── Assemble result card HTML ──
      resultCard.innerHTML = `
        <div class="celebration-icon">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>

        <h2 class="result-title">${resultConf.title || "Assessment Submitted!"}</h2>
        <p class="result-greeting">${personalizedGreeting}</p>

        <section class="club-gallery" aria-label="Dhruva Club photo gallery">
          <h3 class="club-gallery-title">A glimpse of Dhruva Club</h3>
          <div class="club-gallery-slideshow" id="clubGallerySlideshow" aria-roledescription="carousel">
            <figure class="club-gallery-slide">
              <img src="assets/club-gallery-hike.png" alt="Dhruva Club students enjoying a group hike" loading="lazy">
              <figcaption class="club-gallery-caption">Growing together through shared experiences</figcaption>
            </figure>
            <figure class="club-gallery-slide" hidden>
              <img src="assets/club-gallery-fields.png" alt="Green fields during a Dhruva Club outing" loading="lazy">
              <figcaption class="club-gallery-caption">Finding space to reflect and recharge</figcaption>
            </figure>
            <figure class="club-gallery-slide" hidden>
              <img src="assets/club-gallery-team.png" alt="Dhruva Club members together outdoors" loading="lazy">
              <figcaption class="club-gallery-caption">The Dhruva Club community</figcaption>
            </figure>
          </div>
          <div class="club-gallery-controls">
            <button type="button" class="club-gallery-arrow" id="galleryPrevious" aria-label="Previous photo">‹</button>
            <span class="club-gallery-position" id="galleryPosition" aria-live="polite">1 / 3</span>
            <button type="button" class="club-gallery-arrow" id="galleryNext" aria-label="Next photo">›</button>
          </div>
          <div class="club-gallery-dots" id="clubGalleryDots" aria-label="Choose a photo"></div>
          <div style="text-align:center;margin-top:10px;">
            <button type="button" class="btn btn-secondary" id="galleryPause" aria-pressed="false">Pause slideshow</button>
          </div>
        </section>

        ${overallChips}

        <!-- 3-Part Score Cards with Bullet Analysis -->
        <div class="result-score-grid">
          ${buildScoreCard("pq", scores.pq)}
          ${buildScoreCard("iq", scores.iq)}
          ${buildScoreCard("sq", scores.sq)}
        </div>

        <!-- Dynamic Combined CTA -->
        <div class="cta-box">
          <div class="cta-box-badge">${hasJoined ? "Community Member" : "Community Invitation"}</div>
          <h3>${ctaHeading}</h3>
          <p>${ctaBody}</p>
          <a href="${targetLink}" id="whatsappRedirectBtn" target="_blank" rel="noopener noreferrer" class="whatsapp-btn">
            <svg class="whatsapp-icon" viewBox="0 0 24 24">
              <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
            </svg>
            <span>${ctaBtnText}</span>
          </a>
        </div>
      `;

      const gallery = document.getElementById("clubGallerySlideshow");
      if (gallery) {
        const slides = Array.from(gallery.querySelectorAll(".club-gallery-slide"));
        const dotsContainer = document.getElementById("clubGalleryDots");
        const position = document.getElementById("galleryPosition");
        const pauseButton = document.getElementById("galleryPause");
        let activeSlide = 0;
        let timer;
        let paused = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        function showSlide(index) {
          activeSlide = (index + slides.length) % slides.length;
          slides.forEach((slide, slideIndex) => {
            slide.hidden = slideIndex !== activeSlide;
          });
          Array.from(dotsContainer.children).forEach((dot, dotIndex) => {
            dot.setAttribute("aria-current", String(dotIndex === activeSlide));
          });
          position.textContent = `${activeSlide + 1} / ${slides.length}`;
        }

        slides.forEach((_, index) => {
          const dot = document.createElement("button");
          dot.type = "button";
          dot.className = "club-gallery-dot";
          dot.setAttribute("aria-label", `Show photo ${index + 1}`);
          dot.addEventListener("click", () => showSlide(index));
          dotsContainer.appendChild(dot);
        });

        function updateAutoplay() {
          window.clearInterval(timer);
          if (!paused) {
            timer = window.setInterval(() => showSlide(activeSlide + 1), 5000);
          }
          pauseButton.textContent = paused ? "Play slideshow" : "Pause slideshow";
          pauseButton.setAttribute("aria-pressed", String(paused));
        }

        document.getElementById("galleryPrevious").addEventListener("click", () => showSlide(activeSlide - 1));
        document.getElementById("galleryNext").addEventListener("click", () => showSlide(activeSlide + 1));
        pauseButton.addEventListener("click", () => {
          paused = !paused;
          updateAutoplay();
        });
        gallery.addEventListener("mouseenter", () => window.clearInterval(timer));
        gallery.addEventListener("mouseleave", updateAutoplay);
        gallery.addEventListener("focusin", () => window.clearInterval(timer));
        gallery.addEventListener("focusout", event => {
          if (!gallery.contains(event.relatedTarget)) updateAutoplay();
        });
        showSlide(0);
        updateAutoplay();
      }

      if (resultBadge) resultBadge.textContent = resultConf.badge || "Evaluation Complete";
    });
  </script>
</body>
</html>
